<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR-код для пропуска</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        font-family: "Unbounded", sans-serif;
      }

      .qr {
        width: min(90vw, 520px);
        height: auto;
        padding: 16px;
        border-radius: 20px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        box-shadow: 0 24px 40px rgba(15, 23, 42, 0.12);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <img class="qr" src="qr.png" alt="QR-код для пропуска" />
  </body>
</html>
